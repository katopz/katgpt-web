# WebAssembly bindings over `sudoku-core`. This crate is nothing but the
# wasm-bindgen surface; all solver logic lives in sudoku-core (testable
# natively). Member of the katgpt-web workspace (see ../../Cargo.toml).
[package]
name = "sudoku-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen bindings over sudoku-core for the KatGPT-RS web demo."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.120"
sudoku-core = { path = "../sudoku-core" }
